<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FairTransition – vom Mandat zum geordneten Abschluss</title>
  <desc id="desc">Siebenstufiger FairTransition-Standardprozess von Auftragsklärung bis Abschluss und Nachsorge.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feBlend in="SourceGraphic" mode="normal" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9A96E" />
    </marker>
    <style>
      .kicker{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:2.3px;fill:#C9A96E}
      .title{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:44px;font-weight:650;letter-spacing:-0.8px;fill:#152238}
      .subtitle{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:20px;font-weight:400;fill:#667085}
      .h2{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:25px;font-weight:650;fill:#152238}
      .h3{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:21px;font-weight:650;fill:#152238}
      .body{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:19px;font-weight:400;fill:#24303F}
      .small{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:16px;font-weight:400;fill:#667085}
      .micro{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:14px;font-weight:500;fill:#667085}
      .num{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:18px;font-weight:700;fill:#C9A96E}
      .white{fill:#FFFFFF}
      .rule{stroke:#D9D2C6;stroke-width:1.5}
      .connector{stroke:#C9A96E;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .softline{stroke:#D9D2C6;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F6F3EE" />
  
    <text x="80" y="70" class="kicker">FAIRTRANSITION · STANDARDPROZESS 01</text>
    <text x="80" y="128" class="title">FairTransition – vom Mandat zum geordneten Abschluss</text>
    <text x="80" y="169" class="subtitle" text-anchor="start"><tspan x="80" dy="0">Ein klarer Prozess schützt Würde, Entscheidungsfähigkeit und betriebliches Wissen gleichzeitig.</tspan></text>
    <line x1="80" y1="205" x2="1520" y2="205" class="rule" />
  
    <line x1="145" y1="390" x2="1455" y2="390" stroke="#D9D2C6" stroke-width="6" />
    
      <circle cx="160" cy="390" r="48" fill="#152238" filter="url(#shadow)" />
      <text x="160" y="398" class="num white" text-anchor="middle">01</text>
      <text x="160" y="475" class="h3" text-anchor="middle">Mandat</text>
      <text x="160" y="504" class="h3" text-anchor="middle">klären</text>
      <circle cx="370" cy="390" r="48" fill="#152238" filter="url(#shadow)" />
      <text x="370" y="398" class="num white" text-anchor="middle">02</text>
      <text x="370" y="475" class="h3" text-anchor="middle">Lagebild</text>
      <text x="370" y="504" class="h3" text-anchor="middle">erstellen</text>
      <circle cx="580" cy="390" r="48" fill="#152238" filter="url(#shadow)" />
      <text x="580" y="398" class="num white" text-anchor="middle">03</text>
      <text x="580" y="475" class="h3" text-anchor="middle">Übergang</text>
      <text x="580" y="504" class="h3" text-anchor="middle">vorbereiten</text>
      <circle cx="790" cy="390" r="48" fill="#C9A96E" filter="url(#shadow)" />
      <text x="790" y="398" class="num white" text-anchor="middle">04</text>
      <text x="790" y="475" class="h3" text-anchor="middle">Gespräch</text>
      <text x="790" y="504" class="h3" text-anchor="middle">führen</text>
      <circle cx="1000" cy="390" r="48" fill="#152238" filter="url(#shadow)" />
      <text x="1000" y="398" class="num white" text-anchor="middle">05</text>
      <text x="1000" y="475" class="h3" text-anchor="middle">Neuorientierung</text>
      <text x="1000" y="504" class="h3" text-anchor="middle">begleiten</text>
      <circle cx="1210" cy="390" r="48" fill="#152238" filter="url(#shadow)" />
      <text x="1210" y="398" class="num white" text-anchor="middle">06</text>
      <text x="1210" y="475" class="h3" text-anchor="middle">Wissen</text>
      <text x="1210" y="504" class="h3" text-anchor="middle">übergeben</text>
      <circle cx="1420" cy="390" r="48" fill="#152238" filter="url(#shadow)" />
      <text x="1420" y="398" class="num white" text-anchor="middle">07</text>
      <text x="1420" y="475" class="h3" text-anchor="middle">Abschluss</text>
      <text x="1420" y="504" class="h3" text-anchor="middle">sichern</text>

    <rect x="80" y="575" width="1440" height="210" rx="26" fill="#FCFBF8" stroke="#D9D2C6" />
    <text x="120" y="630" class="kicker">DREI PARALLELE WIRKLINIEN</text>
    <line x1="390" y1="665" x2="1450" y2="665" stroke="#D9D2C6" stroke-width="2" />
    <line x1="390" y1="715" x2="1450" y2="715" stroke="#D9D2C6" stroke-width="2" />
    <line x1="390" y1="765" x2="1450" y2="765" stroke="#D9D2C6" stroke-width="2" />
    <text x="120" y="672" class="h3">Unternehmen</text><text x="390" y="672" class="body">Entscheidungssicherheit → Risikosteuerung → geordnete Umsetzung</text>
    <text x="120" y="722" class="h3">Mitarbeitende</text><text x="390" y="722" class="body">Klarheit → Handlungsfähigkeit → tragfähiger nächster Schritt</text>
    <text x="120" y="772" class="h3">Wissen</text><text x="390" y="772" class="body">Risiken erkennen → Erfahrung übertragen → Übernahme validieren</text>
    <text x="80" y="852" class="micro">FairTransition-Praxisstandard · Reihenfolge wird an Fall, Organisation und rechtliche Rahmenbedingungen angepasst.</text>
  </svg>