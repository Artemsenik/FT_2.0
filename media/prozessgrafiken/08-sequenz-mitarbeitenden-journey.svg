<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vom Orientierungsverlust zur nächsten tragfähigen Aufgabe</title>
  <desc id="desc">Sechsstufige Mitarbeitenden-Journey von Stabilisierung über Standortbestimmung bis zum Übergang in die nächste Aufgabe.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feBlend in="SourceGraphic" mode="normal" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9A96E" />
    </marker>
    <style>
      .kicker{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:2.3px;fill:#C9A96E}
      .title{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:44px;font-weight:650;letter-spacing:-0.8px;fill:#152238}
      .subtitle{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:20px;font-weight:400;fill:#667085}
      .h2{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:25px;font-weight:650;fill:#152238}
      .h3{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:21px;font-weight:650;fill:#152238}
      .body{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:19px;font-weight:400;fill:#24303F}
      .small{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:16px;font-weight:400;fill:#667085}
      .micro{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:14px;font-weight:500;fill:#667085}
      .num{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:18px;font-weight:700;fill:#C9A96E}
      .white{fill:#FFFFFF}
      .rule{stroke:#D9D2C6;stroke-width:1.5}
      .connector{stroke:#C9A96E;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .softline{stroke:#D9D2C6;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F6F3EE" />
  
    <text x="80" y="70" class="kicker">FAIRTRANSITION · PROZESSSEQUENZ 02</text>
    <text x="80" y="128" class="title">Vom Orientierungsverlust zur nächsten tragfähigen Aufgabe</text>
    <text x="80" y="169" class="subtitle" text-anchor="start"><tspan x="80" dy="0">Die Begleitung folgt der psychologischen und praktischen Arbeitsfähigkeit – nicht einem starren Bewerbungstakt.</tspan></text>
    <line x1="80" y1="205" x2="1520" y2="205" class="rule" />
  
    <path d="M150 635 C340 635 330 340 520 340 S700 635 880 635 S1060 340 1240 340 S1380 470 1460 470" fill="none" stroke="#D9D2C6" stroke-width="7" />
    
      <circle cx="170" cy="635" r="54" fill="#9A685B" filter="url(#shadow)" />
      <text x="170" y="642" class="num white" text-anchor="middle">01</text>
      <rect x="65" y="455" width="210" height="120" rx="20" fill="#FCFBF8" stroke="#D9D2C6" />
      <text x="170" y="490" class="h3" text-anchor="middle">Stabilisieren</text>
      <text x="170" y="523" class="small" text-anchor="middle"><tspan x="170" dy="0">Fakten, Ruhe,</tspan><tspan x="170" dy="24">nächster Termin</tspan></text>
      <circle cx="420" cy="420" r="54" fill="#152238" filter="url(#shadow)" />
      <text x="420" y="427" class="num white" text-anchor="middle">02</text>
      <rect x="315" y="505" width="210" height="120" rx="20" fill="#FCFBF8" stroke="#D9D2C6" />
      <text x="420" y="540" class="h3" text-anchor="middle">Verstehen</text>
      <text x="420" y="573" class="small" text-anchor="middle"><tspan x="420" dy="0">Situation und</tspan><tspan x="420" dy="24">Rahmen klären</tspan></text>
      <circle cx="650" cy="420" r="54" fill="#152238" filter="url(#shadow)" />
      <text x="650" y="427" class="num white" text-anchor="middle">03</text>
      <rect x="545" y="505" width="210" height="120" rx="20" fill="#FCFBF8" stroke="#D9D2C6" />
      <text x="650" y="540" class="h3" text-anchor="middle">Profilieren</text>
      <text x="650" y="573" class="small" text-anchor="middle"><tspan x="650" dy="0">Erfahrung, Stärken,</tspan><tspan x="650" dy="24">Zielrollen</tspan></text>
      <circle cx="880" cy="635" r="54" fill="#152238" filter="url(#shadow)" />
      <text x="880" y="642" class="num white" text-anchor="middle">04</text>
      <rect x="775" y="455" width="210" height="120" rx="20" fill="#FCFBF8" stroke="#D9D2C6" />
      <text x="880" y="490" class="h3" text-anchor="middle">Positionieren</text>
      <text x="880" y="523" class="small" text-anchor="middle"><tspan x="880" dy="0">Botschaft, Dossier,</tspan><tspan x="880" dy="24">Marktzugang</tspan></text>
      <circle cx="1120" cy="420" r="54" fill="#152238" filter="url(#shadow)" />
      <text x="1120" y="427" class="num white" text-anchor="middle">05</text>
      <rect x="1015" y="505" width="210" height="120" rx="20" fill="#FCFBF8" stroke="#D9D2C6" />
      <text x="1120" y="540" class="h3" text-anchor="middle">Erproben</text>
      <text x="1120" y="573" class="small" text-anchor="middle"><tspan x="1120" dy="0">Gespräche, Feedback,</tspan><tspan x="1120" dy="24">Nachschärfung</tspan></text>
      <circle cx="1390" cy="470" r="54" fill="#58705F" filter="url(#shadow)" />
      <text x="1390" y="477" class="num white" text-anchor="middle">06</text>
      <rect x="1285" y="555" width="210" height="120" rx="20" fill="#FCFBF8" stroke="#D9D2C6" />
      <text x="1390" y="590" class="h3" text-anchor="middle">Übertreten</text>
      <text x="1390" y="623" class="small" text-anchor="middle"><tspan x="1390" dy="0">Entscheiden, starten,</tspan><tspan x="1390" dy="24">stabilisieren</tspan></text>

    <rect x="320" y="730" width="960" height="78" rx="39" fill="#152238" />
    <text x="800" y="764" class="micro white" text-anchor="middle">ZENTRALES PRINZIP</text>
    <text x="800" y="794" class="h3 white" text-anchor="middle">Handlungsfähigkeit wächst durch kleine, überprüfbare Entscheidungen.</text>
    <text x="80" y="862" class="micro">FairTransition-Praxisstandard · Tempo und Schwerpunkte richten sich nach Person, Situation und Mandat.</text>
  </svg>