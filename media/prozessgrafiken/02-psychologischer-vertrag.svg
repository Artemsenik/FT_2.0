<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Der psychologische Vertrag im Übergang</title>
  <desc id="desc">Gegenüberstellung von formellem Arbeitsvertrag und psychologischem Vertrag sowie drei Schritte zur Klärung im Übergang.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feBlend in="SourceGraphic" mode="normal" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9A96E" />
    </marker>
    <style>
      .kicker{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:2.3px;fill:#C9A96E}
      .title{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:44px;font-weight:650;letter-spacing:-0.8px;fill:#152238}
      .subtitle{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:20px;font-weight:400;fill:#667085}
      .h2{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:25px;font-weight:650;fill:#152238}
      .h3{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:21px;font-weight:650;fill:#152238}
      .body{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:19px;font-weight:400;fill:#24303F}
      .small{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:16px;font-weight:400;fill:#667085}
      .micro{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:14px;font-weight:500;fill:#667085}
      .num{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:18px;font-weight:700;fill:#C9A96E}
      .white{fill:#FFFFFF}
      .rule{stroke:#D9D2C6;stroke-width:1.5}
      .connector{stroke:#C9A96E;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .softline{stroke:#D9D2C6;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F6F3EE" />
  
    <text x="80" y="70" class="kicker">FAIRTRANSITION · THEORETISCHE GRUNDLAGE 02</text>
    <text x="80" y="128" class="title">Der psychologische Vertrag im Übergang</text>
    <text x="80" y="169" class="subtitle" text-anchor="start"><tspan x="80" dy="0">Neben dem Arbeitsvertrag bestehen unausgesprochene Erwartungen. Trennungen verändern genau diesen Erwartungsrahmen.</tspan></text>
    <line x1="80" y1="205" x2="1520" y2="205" class="rule" />
  
    <rect x="100" y="255" width="520" height="300" rx="28" fill="#FCFBF8" stroke="#D9D2C6" filter="url(#shadow)" />
    <rect x="100" y="255" width="520" height="16" rx="8" fill="#152238" />
    <text x="145" y="325" class="h2">Formeller Arbeitsvertrag</text>
    <text x="145" y="365" class="micro">SCHRIFTLICH · RECHTLICH · EXPLIZIT</text>
    <text x="145" y="420" class="body" text-anchor="start"><tspan x="145" dy="0">Aufgaben und Funktion</tspan><tspan x="145" dy="39">Vergütung und Arbeitszeit</tspan><tspan x="145" dy="39">Kündigungsfristen und Pflichten</tspan></text>
    <rect x="145" y="505" width="350" height="2" fill="#D9D2C6" />
    <text x="145" y="535" class="small">Regelt, was vereinbart wurde.</text>

    <rect x="980" y="255" width="520" height="300" rx="28" fill="#FCFBF8" stroke="#D9D2C6" filter="url(#shadow)" />
    <rect x="980" y="255" width="520" height="16" rx="8" fill="#C9A96E" />
    <text x="1025" y="325" class="h2">Psychologischer Vertrag</text>
    <text x="1025" y="365" class="micro">WAHRGENOMMEN · UNAUSGESPROCHEN · BEZIEHUNGSBEZOGEN</text>
    <text x="1025" y="420" class="body" text-anchor="start"><tspan x="1025" dy="0">Loyalität und Anerkennung</tspan><tspan x="1025" dy="39">Sicherheit und Entwicklung</tspan><tspan x="1025" dy="39">Fairness und Gegenseitigkeit</tspan></text>
    <rect x="1025" y="505" width="350" height="2" fill="#D9D2C6" />
    <text x="1025" y="535" class="small">Prägt, was Menschen erwarten.</text>

    <path d="M640 405 H940" class="connector" />
    <rect x="670" y="325" width="260" height="160" rx="80" fill="#152238" filter="url(#shadow)" />
    <text x="800" y="375" class="kicker" text-anchor="middle">ÜBERGANG</text>
    <text x="800" y="415" class="h3 white" text-anchor="middle"><tspan x="800" dy="0">verändert den</tspan><tspan x="800" dy="28">Erwartungsrahmen</tspan></text>

    <text x="100" y="630" class="h2">FairTransition-Praxisstandard</text>
    <line x1="195" y1="720" x2="1405" y2="720" stroke="#D9D2C6" stroke-width="5" />
    <circle cx="270" cy="720" r="42" fill="#152238" /><text x="270" y="728" class="num white" text-anchor="middle">01</text>
    <circle cx="800" cy="720" r="42" fill="#C9A96E" /><text x="800" y="728" class="num white" text-anchor="middle">02</text>
    <circle cx="1330" cy="720" r="42" fill="#58705F" /><text x="1330" y="728" class="num white" text-anchor="middle">03</text>
    <text x="270" y="790" class="h3" text-anchor="middle">Erwartungen benennen</text>
    <text x="270" y="824" class="small" text-anchor="middle">Was war zugesagt oder angenommen?</text>
    <text x="800" y="790" class="h3" text-anchor="middle">Realität klären</text>
    <text x="800" y="824" class="small" text-anchor="middle">Was gilt jetzt tatsächlich?</text>
    <text x="1330" y="790" class="h3" text-anchor="middle">Verlässlich handeln</text>
    <text x="1330" y="824" class="small" text-anchor="middle">Was wird wie und bis wann umgesetzt?</text>
    <text x="80" y="868" class="micro">Grundlage: Rousseau (1989), Psychological and Implied Contracts in Organizations · Praxisübertragung: FairTransition</text>
  </svg>