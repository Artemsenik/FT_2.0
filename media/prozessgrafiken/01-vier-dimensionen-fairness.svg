<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vier Dimensionen fair erlebter Behandlung</title>
  <desc id="desc">Vier miteinander verbundene Dimensionen: Verfahrensgerechtigkeit, Ergebnisgerechtigkeit, zwischenmenschliche Gerechtigkeit und Informationsgerechtigkeit.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feBlend in="SourceGraphic" mode="normal" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9A96E" />
    </marker>
    <style>
      .kicker{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:2.3px;fill:#C9A96E}
      .title{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:44px;font-weight:650;letter-spacing:-0.8px;fill:#152238}
      .subtitle{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:20px;font-weight:400;fill:#667085}
      .h2{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:25px;font-weight:650;fill:#152238}
      .h3{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:21px;font-weight:650;fill:#152238}
      .body{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:19px;font-weight:400;fill:#24303F}
      .small{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:16px;font-weight:400;fill:#667085}
      .micro{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:14px;font-weight:500;fill:#667085}
      .num{font-family:Inter,Helvetica Neue,Arial,sans-serif;font-size:18px;font-weight:700;fill:#C9A96E}
      .white{fill:#FFFFFF}
      .rule{stroke:#D9D2C6;stroke-width:1.5}
      .connector{stroke:#C9A96E;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .softline{stroke:#D9D2C6;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F6F3EE" />
  
    <text x="80" y="70" class="kicker">FAIRTRANSITION · THEORETISCHE GRUNDLAGE 01</text>
    <text x="80" y="128" class="title">Vier Dimensionen fair erlebter Behandlung</text>
    <text x="80" y="169" class="subtitle" text-anchor="start"><tspan x="80" dy="0">Fairness entsteht nicht nur durch das Ergebnis, sondern auch durch Verfahren, Umgang und Information.</tspan></text>
    <line x1="80" y1="205" x2="1520" y2="205" class="rule" />
  
    <circle cx="800" cy="525" r="145" fill="#152238" filter="url(#shadow)" />
    <text x="800" y="500" class="kicker" text-anchor="middle">FAIR ERLEBTER</text>
    <text x="800" y="540" class="h2 white" text-anchor="middle">Übergang</text>
    <text x="800" y="578" class="small white" text-anchor="middle"><tspan x="800" dy="0">Klarheit · Würde ·</tspan><tspan x="800" dy="23">Verlässlichkeit</tspan></text>

    <path d="M690 425 C620 360 570 340 500 340" class="softline" />
    <path d="M910 425 C980 360 1030 340 1100 340" class="softline" />
    <path d="M690 625 C620 690 570 710 500 710" class="softline" />
    <path d="M910 625 C980 690 1030 710 1100 710" class="softline" />

    <rect x="110" y="255" width="470" height="190" rx="24" fill="#FCFBF8" stroke="#D9D2C6" filter="url(#shadow)" />
    <circle cx="158" cy="305" r="23" fill="#F1E6D1" /><text x="158" y="312" class="num" text-anchor="middle">01</text>
    <text x="200" y="314" class="h3">Verfahrensgerechtigkeit</text>
    <text x="158" y="353" class="body" text-anchor="start"><tspan x="158" dy="0">Der Weg zur Entscheidung ist konsistent,</tspan><tspan x="158" dy="28">unvoreingenommen, nachvollziehbar und korrigierbar.</tspan></text>
    <text x="158" y="420" class="micro">KERNFRAGE  ·  War das Verfahren fair?</text>

    <rect x="1020" y="255" width="470" height="190" rx="24" fill="#FCFBF8" stroke="#D9D2C6" filter="url(#shadow)" />
    <circle cx="1068" cy="305" r="23" fill="#F1E6D1" /><text x="1068" y="312" class="num" text-anchor="middle">02</text>
    <text x="1110" y="314" class="h3">Ergebnisgerechtigkeit</text>
    <text x="1068" y="353" class="body" text-anchor="start"><tspan x="1068" dy="0">Folgen, Leistungen und Unterstützung stehen</tspan><tspan x="1068" dy="28">in einem begründbaren und angemessenen Verhältnis.</tspan></text>
    <text x="1068" y="420" class="micro">KERNFRAGE  ·  Ist das Ergebnis vertretbar?</text>

    <rect x="110" y="610" width="470" height="190" rx="24" fill="#FCFBF8" stroke="#D9D2C6" filter="url(#shadow)" />
    <circle cx="158" cy="660" r="23" fill="#F1E6D1" /><text x="158" y="667" class="num" text-anchor="middle">03</text>
    <text x="200" y="669" class="h3">Zwischenmenschliche Gerechtigkeit</text>
    <text x="158" y="708" class="body" text-anchor="start"><tspan x="158" dy="0">Die betroffene Person wird mit Respekt,</tspan><tspan x="158" dy="28">Würde, Anstand und Sensibilität behandelt.</tspan></text>
    <text x="158" y="775" class="micro">KERNFRAGE  ·  Wie wurde mit mir umgegangen?</text>

    <rect x="1020" y="610" width="470" height="190" rx="24" fill="#FCFBF8" stroke="#D9D2C6" filter="url(#shadow)" />
    <circle cx="1068" cy="660" r="23" fill="#F1E6D1" /><text x="1068" y="667" class="num" text-anchor="middle">04</text>
    <text x="1110" y="669" class="h3">Informationsgerechtigkeit</text>
    <text x="1068" y="708" class="body" text-anchor="start"><tspan x="1068" dy="0">Begründungen sind wahrheitsgemäss, rechtzeitig,</tspan><tspan x="1068" dy="28">verständlich und auf die Situation abgestimmt.</tspan></text>
    <text x="1068" y="775" class="micro">KERNFRAGE  ·  Wurde offen und klar erklärt?</text>

    <text x="80" y="858" class="micro">Grundlage: Colquitt (2001), Vier-Faktoren-Modell organisationaler Gerechtigkeit · Übertragung auf berufliche Übergänge: FairTransition</text>
  </svg>